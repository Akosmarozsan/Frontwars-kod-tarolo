<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helyi Adattároló Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-800 rounded-xl shadow-2xl p-6 border border-slate-700">
        <h1 class="text-2xl font-bold mb-2 text-indigo-400">Helyi Szövegtároló</h1>
        <p class="text-slate-400 text-sm mb-6">A beírt szöveg a böngésződ helyi tárolójában (LocalStorage) őrződik meg.</p>
        
        <div class="space-y-4">
            <div>
                <label for="strInput" class="block text-sm font-medium text-slate-300 mb-1">Elmentendő szöveg:</label>
                <textarea id="strInput" rows="4" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition" placeholder="Írj be valamit..."></textarea>
            </div>
            
            <div class="flex gap-3">
                <button id="saveBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 px-4 rounded-lg transition duration-200 shadow-md hover:shadow-indigo-500/20">
                    Mentés
                </button>
                <button id="clearBtn" class="bg-slate-700 hover:bg-red-600 text-slate-300 hover:text-white font-medium py-2 px-4 rounded-lg transition duration-200">
                    Törlés
                </button>
            </div>

            <div id="statusMsg" class="text-sm font-medium text-emerald-400 h-5 opacity-0 transition-opacity duration-300">
                Sikeresen elmentve!
            </div>
        </div>

        <div class="mt-8 pt-6 border-t border-slate-700">
            <h2 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Jelenleg tárolt érték:</h2>
            <div id="preview" class="p-3 bg-slate-900/50 rounded-lg border border-slate-800 text-slate-300 text-sm italic break-words min-h-[40px]">
                (Nincs elmentett adat)
            </div>
        </div>
    </div>

    <script>
        const strInput = document.getElementById('strInput');
        const saveBtn = document.getElementById('saveBtn');
        const clearBtn = document.getElementById('clearBtn');
        const statusMsg = document.getElementById('statusMsg');
        const preview = document.getElementById('preview');

        const STORAGE_KEY = 'my_saved_string';

        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved !== null && saved !== '') {
                strInput.value = saved;
                preview.textContent = saved;
                preview.classList.remove('italic', 'text-slate-500');
                preview.classList.add('text-slate-200');
            } else {
                strInput.value = '';
                preview.textContent = '(Nincs elmentett adat)';
                preview.classList.add('italic', 'text-slate-500');
                preview.classList.remove('text-slate-200');
            }
        }

        function showStatus(text, colorClass = 'text-emerald-400') {
            statusMsg.textContent = text;
            statusMsg.className = `text-sm font-medium h-5 transition-opacity duration-300 opacity-100 ${colorClass}`;
            setTimeout(() => {
                statusMsg.classList.add('opacity-0');
            }, 2000);
        }

        saveBtn.addEventListener('click', () => {
            const val = strInput.value;
            localStorage.setItem(STORAGE_KEY, val);
            loadData();
            showStatus('Sikeresen elmentve!');
        });

        clearBtn.addEventListener('click', () => {
            localStorage.removeItem(STORAGE_KEY);
            loadData();
            showStatus('Adatok törölve!', 'text-rose-400');
        });

        loadData();
    </script>
</body>
</html>
